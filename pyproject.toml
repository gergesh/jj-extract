[project]
name = "commit-mychanges"
version = "0.1.0"
description = "Per-agent change attribution for shared working directories (jj & git)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
mychanges = "commit_mychanges.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_mychanges"]
